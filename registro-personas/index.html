<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/webp" href="/logo-lavid.webp" />
    <link rel="apple-touch-icon" href="/logo-lavid.webp" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <title>La Vid · Registro de personas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@300;400;600;700;800&display=swap">
    <script>try{document.documentElement.setAttribute('data-theme',localStorage.getItem('theme')||'light')}catch(e){}</script>
    <style>
      /* Pantalla de carga: visible desde el primer byte, antes de que cargue el JavaScript */
      .splash{--sp-bg:#000;--sp-fg:#fff;--sp-mute:#a3a3a3;--sp-accent:#fff;--sp-track:#262626;position:fixed;inset:0;z-index:10000;display:flex;align-items:center;justify-content:center;padding:1.5rem;background:var(--sp-bg);color:var(--sp-fg);font-family:'Josefin Sans',system-ui,sans-serif;text-align:center;opacity:1;transition:opacity .45s ease,visibility .45s}
      .splash-hide{opacity:0;visibility:hidden;pointer-events:none}
      .splash-inner{display:flex;flex-direction:column;align-items:center;gap:.9rem;max-width:26rem;animation:splashIn .6s ease both}
      .splash-logo{width:clamp(200px,58vw,340px);height:auto;display:block}
      .splash-text{font-size:clamp(.9rem,3.4vw,1.05rem);color:var(--sp-mute);line-height:1.5;font-weight:400;margin:0}
      .splash-bar{width:min(220px,60vw);height:4px;border-radius:4px;background:var(--sp-track);overflow:hidden;margin-top:.6rem}
      .splash-bar span{display:block;height:100%;width:40%;border-radius:4px;background:var(--sp-accent);animation:splashBar 1.2s ease-in-out infinite}
      @keyframes splashBar{0%{transform:translateX(-110%)}100%{transform:translateX(260%)}}
      @keyframes splashIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
      @media (prefers-reduced-motion:reduce){.splash-inner,.splash-bar span{animation:none}.splash-bar span{width:100%}}
    </style>
  </head>
  <body>
    <div id="root">
      <div class="splash" role="status">
        <div class="splash-inner">
          <img class="splash-logo" src="/logo-lavid.webp" alt="Iglesia La Vid" width="340" height="340">
          <p class="splash-text">Aplicación de registro y manejo de datos para la iglesia La Vid</p>
          <div class="splash-bar" aria-hidden="true"><span></span></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
