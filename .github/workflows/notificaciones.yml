name: Notificaciones

# Correos automáticos de la Iglesia La Vid (bienvenida, cumpleaños, aviso a líderes y anuncios).
# Gratis: GitHub Actions en repositorio público + Gmail. Ver notificaciones/README.md.
on:
  schedule:
    - cron: '*/10 * * * *'   # nuevos + anuncios (cada ~10 min; GitHub puede retrasarlo)
    - cron: '0 12 * * *'     # cumpleaños: 7:00 a. m. hora de Colombia
  workflow_dispatch:
    inputs:
      modo:
        description: 'nuevos | cumples | todo'
        default: 'todo'
      simulacion:
        description: 'true = no envía correos, solo simula'
        default: 'false'

# Una sola ejecución a la vez: evita correos duplicados.
concurrency:
  group: notificaciones
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  enviar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: notificaciones
    steps:
      # Mientras no estén creados los secretos, las ejecuciones programadas se saltan en
      # silencio (en vez de fallar cada 10 minutos). Una ejecución manual sí avisa con error.
      - name: Revisar secretos
        id: secretos
        working-directory: .
        env:
          CUENTA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GMAIL: ${{ secrets.GMAIL_USER }}
          CLAVE: ${{ secrets.GMAIL_APP_PASSWORD }}
          SIMULACION: ${{ github.event.inputs.simulacion }}
          EVENTO: ${{ github.event_name }}
        run: |
          if [ -n "$CUENTA" ] && { [ "$SIMULACION" = "true" ] || { [ -n "$GMAIL" ] && [ -n "$CLAVE" ]; }; }; then
            echo "listo=true" >> "$GITHUB_OUTPUT"
          else
            echo "listo=false" >> "$GITHUB_OUTPUT"
            echo "Faltan secretos (FIREBASE_SERVICE_ACCOUNT, GMAIL_USER, GMAIL_APP_PASSWORD). Ver notificaciones/README.md." >> "$GITHUB_STEP_SUMMARY"
            if [ "$EVENTO" = "workflow_dispatch" ]; then echo "::error::Faltan secretos de GitHub"; exit 1; fi
            echo "::warning::Faltan secretos de GitHub: se omite el envío."
          fi
      - uses: actions/checkout@v4
        if: steps.secretos.outputs.listo == 'true'
      - uses: actions/setup-node@v4
        if: steps.secretos.outputs.listo == 'true'
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: notificaciones/package-lock.json
      - run: npm ci
        if: steps.secretos.outputs.listo == 'true'
      - name: Enviar
        if: steps.secretos.outputs.listo == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          APP_URL: ${{ secrets.APP_URL }}
          DRY_RUN: ${{ github.event.inputs.simulacion == 'true' && '1' || '0' }}
          MODO: ${{ github.event.inputs.modo || (github.event.schedule == '0 12 * * *' && 'cumples' || 'nuevos') }}
        run: node src/index.mjs --modo="$MODO"
